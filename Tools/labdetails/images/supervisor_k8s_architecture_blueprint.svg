  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap");
      text { font-family: "Courier New", Courier, monospace; }
      .hero-title { font-size: 20px; font-weight: 700; fill: #38bdf8; animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #38bdf8; }
