<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap");
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .hero-title { font-size: 20px; font-weight: 700; fill: #da7756; animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #6b6863; }
      .card-title { font-size: 13px; font-weight: 600; fill: #1f1e1c; }
      .card-subtitle { font-size: 11px; fill: #6b6863; }
      .card-detail { font-size: 10.5px; fill: #474542; }
      .container-title { font-size: 12px; font-weight: 600; fill: #1f1e1c; }
      .edge-label { font-size: 10px; font-weight: 600; fill: #1f1e1c; }
      .badge-text { font-size: 9.5px; font-weight: 600; fill: #ffffff; }
      @keyframes icon-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      @keyframes dash-flow { to { stroke-dashoffset: -24px; } }
      @keyframes title-glow { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(88,166,255,0.4)); } }
      .animated-icon { animation: icon-float 3s ease-in-out infinite; transform-origin: center; }
      .flow-dash { animation: dash-flow 1.5s linear infinite; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="50%" stop-color="#f2efe9"/>
      <stop offset="100%" stop-color="#f8f6f3"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da7756"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(188,140,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(188,140,255,0)"/>
    </radialGradient>
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bc8cff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d29922"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1160" height="760" fill="url(#bg-grad)"/>
  <rect width="1160" height="760" fill="url(#glow-blue)"/>
  <rect width="1160" height="760" fill="url(#glow-purple)"/>
  <g transform="translate(40, 36)">
    <text class="hero-title" x="0" y="0">Storage Architecture &amp; Datastore Capacity Summary</text>
    <text class="hero-subtitle" x="0" y="18">Discovered 2 Live Datastores across ESXi Clusters | Domain: site-a.vcf.lab</text>
  </g>
  <g id="container-Site_A_Storage_&amp;_vSAN_Fabric">
    <rect x="35" y="85" width="1090" height="310" rx="14" ry="14" fill="rgba(255, 255, 255, 0.7)" stroke="rgba(188,140,255,0.3)" stroke-width="1.2"/>
    <rect x="47" y="73" width="250.0" height="24" rx="12" fill="#e6e4df" stroke="rgba(188,140,255,0.3)" stroke-width="1"/>
    <text class="container-title" x="59" y="89">💾 Site A Storage &amp; vSAN Fabric</text>
    <text class="card-subtitle" x="1109" y="101" text-anchor="end">Site A Primary Storage Pools</text>
  </g>
  <g id="container-Site_B_Storage_&amp;_vSAN_Fabric">
    <rect x="35" y="415" width="1090" height="310" rx="14" ry="14" fill="rgba(255, 255, 255, 0.7)" stroke="rgba(210,153,34,0.3)" stroke-width="1.2"/>
    <rect x="47" y="403" width="250.0" height="24" rx="12" fill="#e6e4df" stroke="rgba(210,153,34,0.3)" stroke-width="1"/>
    <text class="container-title" x="59" y="419">🏢 Site B Storage &amp; vSAN Fabric</text>
    <text class="card-subtitle" x="1109" y="431" text-anchor="end">Site B Secondary Storage Pools</text>
  </g>
  <g id="card-ds-vsan-site-a-01" filter="url(#glass-shadow)">
    <rect x="65" y="125" width="335" height="230" rx="12" ry="12" fill="#ffffff" stroke="#e6e4df" stroke-width="1.2"/>
    <rect x="66" y="137" width="3.5" height="206" rx="1.7" fill="#bc8cff"/>
    <g class="animated-icon"><text class="card-title" x="79" y="147">💾 vsan-site-a-01</text></g>
    <rect x="332.6" y="135" width="57.4" height="18" rx="9" fill="#3fb950"/>
    <circle cx="340.6" cy="144" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340.6" cy="144" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="365.3" y="147.5" text-anchor="middle">HEALTHY</text>
    <text class="card-subtitle" x="79" y="163">Type: VSAN_ESA | Site: Site A</text>
    <text class="card-detail" x="79" y="191">• Total Capacity: 12000 GB</text>
    <text class="card-detail" x="79" y="205">• Used Space: 4500 GB (37.5%)</text>
    <text class="card-detail" x="79" y="219">• Free Space: 7500 GB</text>
    <text class="card-detail" x="79" y="233">• Policy: vSAN ESA RAID-5/6</text>
  </g>
  <g id="card-ds-vsan-site-b-01" filter="url(#glass-shadow)">
    <rect x="65" y="455" width="335" height="230" rx="12" ry="12" fill="#ffffff" stroke="#e6e4df" stroke-width="1.2"/>
    <rect x="66" y="467" width="3.5" height="206" rx="1.7" fill="#d29922"/>
    <g class="animated-icon"><text class="card-title" x="79" y="477">💾 vsan-site-b-01</text></g>
    <rect x="332.6" y="465" width="57.4" height="18" rx="9" fill="#3fb950"/>
    <circle cx="340.6" cy="474" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340.6" cy="474" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="365.3" y="477.5" text-anchor="middle">HEALTHY</text>
    <text class="card-subtitle" x="79" y="493">Type: VSAN_ESA | Site: Site B</text>
    <text class="card-detail" x="79" y="521">• Total Capacity: 12000 GB</text>
    <text class="card-detail" x="79" y="535">• Used Space: 4500 GB (37.5%)</text>
    <text class="card-detail" x="79" y="549">• Free Space: 7500 GB</text>
    <text class="card-detail" x="79" y="563">• Policy: vSAN ESA RAID-5/6</text>
  </g>
  <g id="legend">
    <rect x="960" y="24" width="170" height="100" rx="8" fill="#e6e4df" stroke="#e6e4df" stroke-width="1"/>
    <circle cx="976" cy="38" r="5" fill="#bc8cff"/>
    <text class="card-detail" x="990" y="42">Site A Storage</text>
    <circle cx="976" cy="58" r="5" fill="#d29922"/>
    <text class="card-detail" x="990" y="62">Site B Storage</text>
    <circle cx="976" cy="78" r="5" fill="#38bdf8"/>
    <text class="card-detail" x="990" y="82">Storage Policy</text>
    <circle cx="976" cy="98" r="5" fill="#58a6ff"/>
    <text class="card-detail" x="990" y="102">NFS / Backup Storage</text>
  </g>
</svg>