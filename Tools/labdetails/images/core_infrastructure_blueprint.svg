    <rect x="317" y="73" width="227.5" height="24" rx="12" fill="#0a1628" stroke="rgba(88,166,255,0.3)" stroke-width="1"/>
    <text class="container-title" x="329" y="89">🛠️ Core Services Fabric (L1)</text>
    <text class="card-subtitle" x="779" y="101" text-anchor="end">10.1.10.128/25</text>
  </g>
  <g id="container-VCF_Ingress_Plane">
