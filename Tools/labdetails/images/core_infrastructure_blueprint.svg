  <rect width="1120" height="660" fill="url(#bg-grad)"/>
  <rect width="1120" height="660" fill="url(#grid-pattern)"/>
  <g transform="translate(40, 36)">
    <text class="hero-title" x="0" y="0">Core Infrastructure &amp; Services Fabric</text>
