      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="716.8" cy="334" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="738.4" y="337.5" text-anchor="middle">ACTIVE</text>
    <text class="card-subtitle" x="574" y="353">10.1.10.131</text>
    <text class="card-detail" x="574" y="381">• • labstartup.py Engine</text>
    <text class="card-detail" x="574" y="395">• • Python API Automations</text>
    <text class="card-detail" x="574" y="409">• • NFS /tmp Export</text>
  </g>
  <g id="card-vcf-ingress">
    <rect x="845" y="130" width="215" height="165" rx="12" ry="12" fill="#102a45" stroke="#00d2ff" stroke-width="1.2"/>
    <rect x="846" y="142" width="3.5" height="141" rx="1.7" fill="#bc8cff"/>
    <g class="animated-icon"><text class="card-title" x="859" y="152">🎛️ VCF Control Plane</text></g>
    <rect x="998.8" y="140" width="51.2" height="18" rx="9" fill="#3fb950"/>
    <circle cx="1006.8" cy="149" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1006.8" cy="149" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="1028.3999999999999" y="152.5" text-anchor="middle">ACTIVE</text>
    <text class="card-subtitle" x="859" y="168">vCenter Control Plane</text>
    <text class="card-detail" x="859" y="196">• • SDDC Manager API</text>
    <text class="card-detail" x="859" y="210">• • vCenter Server VAMI</text>
