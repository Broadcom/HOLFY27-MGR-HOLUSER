    <rect x="52" y="73" width="152.5" height="24" rx="12" fill="#0a1628" stroke="rgba(139,148,158,0.3)" stroke-width="1"/>
    <text class="container-title" x="64" y="89">🌐 External Access</text>
    <text class="card-subtitle" x="254" y="101" text-anchor="end">Upstream Ingress</text>
