    <rect x="837" y="73" width="167.5" height="24" rx="12" fill="#0a1628" stroke="rgba(188,140,255,0.3)" stroke-width="1"/>
    <text class="container-title" x="849" y="89">☁️ VCF Ingress Plane</text>
    <text class="card-subtitle" x="1064" y="101" text-anchor="end">Management Fabric</text>
  </g>
  <g>
    <path d="M 245.0,185.0 L 330.0,185.0" fill="none" stroke="#8b949e" stroke-width="4.0" stroke-opacity="0.25"/>
    <path d="M 245.0,185.0 L 330.0,185.0" fill="none" stroke="#8b949e" stroke-width="2.0" stroke-opacity="0.9" marker-end="url(#arrow-muted)"/>
    <circle r="3" fill="#8b949e" opacity="0.85">
      <animateMotion path="M 245.0,185.0 L 330.0,185.0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="256.8" y="175.0" width="61.5" height="20" rx="6" fill="#0a1628" fill-opacity="0.95" stroke="#8b949e" stroke-width="0.8"/>
