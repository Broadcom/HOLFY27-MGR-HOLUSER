    <circle cx="936" cy="38" r="5" fill="#58a6ff"/>
    <text class="card-detail" x="950" y="42">Network &amp; Security</text>
    <circle cx="936" cy="58" r="5" fill="#3fb950"/>
    <text class="card-detail" x="950" y="62">User Console &amp; UI</text>
