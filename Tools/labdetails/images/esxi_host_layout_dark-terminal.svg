      text { font-family: "SF Mono", "Fira Code", "Consolas", monospace; }
      .hero-title { font-size: 20px; font-weight: 700; fill: #00ff88; animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #00f2fe; }
      .card-title { font-size: 13px; font-weight: 600; fill: #00ff88; }
      .card-subtitle { font-size: 11px; fill: #00f2fe; }
      .card-detail { font-size: 10.5px; fill: #a3e635; }
      .container-title { font-size: 12px; font-weight: 600; fill: #00ff88; }
      .edge-label { font-size: 10px; font-weight: 600; fill: #00ff88; }
      .badge-text { font-size: 9.5px; font-weight: 600; fill: #ffffff; }
      @keyframes icon-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      @keyframes dash-flow { to { stroke-dashoffset: -24px; } }
      @keyframes title-glow { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(88,166,255,0.4)); } }
      .animated-icon { animation: icon-float 3s ease-in-out infinite; transform-origin: center; }
      .flow-dash { animation: dash-flow 1.5s linear infinite; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
