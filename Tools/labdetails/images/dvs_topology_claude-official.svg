<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap");
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .hero-title { font-size: 20px; font-weight: 700; fill: #da7756; animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #6b6863; }
      .card-title { font-size: 13px; font-weight: 600; fill: #1f1e1c; }
