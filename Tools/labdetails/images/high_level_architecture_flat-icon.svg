<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap");
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .hero-title { font-size: 20px; font-weight: 700; fill: #1e293b; animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #64748b; }
      .card-title { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .card-subtitle { font-size: 11px; fill: #64748b; }
      .card-detail { font-size: 10.5px; fill: #334155; }
      .container-title { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .edge-label { font-size: 10px; font-weight: 600; fill: #0f172a; }
      .badge-text { font-size: 9.5px; font-weight: 600; fill: #ffffff; }
      @keyframes icon-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      @keyframes dash-flow { to { stroke-dashoffset: -24px; } }
      @keyframes title-glow { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(88,166,255,0.4)); } }
      .animated-icon { animation: icon-float 3s ease-in-out infinite; transform-origin: center; }
      .flow-dash { animation: dash-flow 1.5s linear infinite; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="65%" r="45%">
