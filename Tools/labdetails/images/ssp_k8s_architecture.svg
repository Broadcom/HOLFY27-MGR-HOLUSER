<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap");
      text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .hero-title { font-size: 20px; font-weight: 700; fill: url(#title-grad); animation: title-glow 4s ease-in-out infinite; }
      .hero-subtitle { font-size: 12px; fill: #8b949e; }
      .card-title { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .card-subtitle { font-size: 11px; fill: #8b949e; }
      .card-detail { font-size: 10.5px; fill: #c9d1d9; }
      .container-title { font-size: 12px; font-weight: 600; fill: #f0f6fc; }
      .edge-label { font-size: 10px; font-weight: 600; fill: #f0f6fc; }
      .badge-text { font-size: 9.5px; font-weight: 600; fill: #ffffff; }
      @keyframes icon-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      @keyframes dash-flow { to { stroke-dashoffset: -24px; } }
      @keyframes title-glow { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(88,166,255,0.4)); } }
      .animated-icon { animation: icon-float 3s ease-in-out infinite; transform-origin: center; }
      .flow-dash { animation: dash-flow 1.5s linear infinite; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(188,140,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(188,140,255,0)"/>
    </radialGradient>
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bc8cff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d29922"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1150" height="720" fill="url(#bg-grad)"/>
  <rect width="1150" height="720" fill="url(#glow-blue)"/>
  <rect width="1150" height="720" fill="url(#glow-purple)"/>
  <g transform="translate(40, 36)">
    <text class="hero-title" x="0" y="0">Security Services Platform (SSP / vDefend) Architecture</text>
    <text class="hero-subtitle" x="0" y="18">CAPI Management Plane, NSX Intelligence &amp; Security Microservices | Domain: site-a.vcf.lab</text>
  </g>
  <g id="container-SSP_CAPI_Management_Cluster_(ssp-i)">
    <rect x="40" y="85" width="1070" height="160" rx="14" ry="14" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(188,140,255,0.3)" stroke-width="1.2"/>
    <rect x="52" y="73" width="302.5" height="24" rx="12" fill="#161b22" stroke="rgba(188,140,255,0.3)" stroke-width="1"/>
    <text class="container-title" x="64" y="89">🛡️ SSP CAPI Management Cluster (ssp-i)</text>
    <text class="card-subtitle" x="1094" y="101" text-anchor="end">10.1.0.10 (sysadmin)</text>
  </g>
  <g id="container-nsxi-platform_Security_Workload_Microservices">
    <rect x="40" y="265" width="1070" height="410" rx="14" ry="14" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(63,185,80,0.3)" stroke-width="1.2"/>
    <rect x="52" y="253" width="377.5" height="24" rx="12" fill="#161b22" stroke="rgba(63,185,80,0.3)" stroke-width="1"/>
    <text class="container-title" x="64" y="269">🔒 nsxi-platform Security Workload Microservices</text>
    <text class="card-subtitle" x="1094" y="281" text-anchor="end">NSX Intelligence &amp; vDefend Fabric</text>
  </g>
  <g>
    <path d="M 575.0,245.0 L 575.0,265.0" fill="none" stroke="#bc8cff" stroke-width="4.0" stroke-opacity="0.25"/>
    <path d="M 575.0,245.0 L 575.0,265.0" fill="none" stroke="#bc8cff" stroke-width="2.0" stroke-opacity="0.9" marker-end="url(#arrow-purple)"/>
    <circle r="3" fill="#bc8cff" opacity="0.85">
      <animateMotion path="M 575.0,245.0 L 575.0,265.0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="508.5" y="245.0" width="133.0" height="20" rx="6" fill="#161b22" fill-opacity="0.95" stroke="#bc8cff" stroke-width="0.8"/>
    <text class="edge-label" x="575.0" y="259.0" text-anchor="middle">CAPI Orchestration</text>
  </g>
  <g id="card-ssp-mgr" filter="url(#glass-shadow)">
    <rect x="70" y="120" width="1010" height="105" rx="12" ry="12" fill="rgba(22, 27, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <rect x="71" y="132" width="3.5" height="81" rx="1.7" fill="#bc8cff"/>
    <g class="animated-icon"><text class="card-title" x="84" y="142">🛡️ ssp-installer / ssp-controller</text></g>
    <rect x="1025.0" y="130" width="45.0" height="18" rx="9" fill="#3fb950"/>
    <circle cx="1033.0" cy="139" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1033.0" cy="139" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="1051.5" y="142.5" text-anchor="middle">Ready</text>
    <text class="card-subtitle" x="84" y="158">10.1.0.10</text>
    <text class="card-detail" x="84" y="186">• CAPI Management: Cluster API, MachineDeployment, KubeadmControlPlane</text>
    <text class="card-detail" x="84" y="200">• Secret: ssp-kubeconfig (kubeconfig for Security Workload Cluster)</text>
    <text class="card-detail" x="84" y="214">• Integration: NSX Manager Security Policy Engine</text>
  </g>
  <g id="card-pod-intel" filter="url(#glass-shadow)">
    <rect x="70" y="305" width="320" height="160" rx="12" ry="12" fill="rgba(22, 27, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <rect x="71" y="317" width="3.5" height="136" rx="1.7" fill="#3fb950"/>
    <g class="animated-icon"><text class="card-title" x="84" y="327">🔍 NSX Intelligence</text></g>
    <rect x="322.6" y="315" width="57.4" height="18" rx="9" fill="#3fb950"/>
    <circle cx="330.6" cy="324" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330.6" cy="324" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="355.3" y="327.5" text-anchor="middle">Running</text>
    <text class="card-subtitle" x="84" y="343">Flow &amp; Network Analytics</text>
    <text class="card-detail" x="84" y="371">• • intelligence-collector</text>
    <text class="card-detail" x="84" y="385">• • flow-analyzer-service</text>
    <text class="card-detail" x="84" y="399">• • recommendation-engine</text>
    <text class="card-detail" x="84" y="413">• • visualization-api</text>
