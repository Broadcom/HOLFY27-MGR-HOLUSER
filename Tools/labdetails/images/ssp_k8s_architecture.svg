    <rect x="416" y="317" width="3.5" height="136" rx="1.7" fill="#3fb950"/>
    <g class="animated-icon"><text class="card-title" x="429" y="327">🛡️ vDefend NDR &amp; IDS/IPS</text></g>
    <rect x="667.6" y="315" width="57.4" height="18" rx="9" fill="#3fb950"/>
    <circle cx="675.6" cy="324" r="3.5" fill="#3fb950">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="675.6" cy="324" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="700.3000000000001" y="327.5" text-anchor="middle">Running</text>
    <text class="card-subtitle" x="429" y="343">Network Threat Detection</text>
    <text class="card-detail" x="429" y="371">• • ndr-detection-engine</text>
    <text class="card-detail" x="429" y="385">• • malware-analysis-agent</text>
    <text class="card-detail" x="429" y="399">• • distributed-ids-service</text>
    <text class="card-detail" x="429" y="413">• • signature-updater</text>
  </g>
  <g id="card-pod-kafka" filter="url(#glass-shadow)">
    <rect x="760" y="305" width="320" height="160" rx="12" ry="12" fill="rgba(22, 27, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <rect x="761" y="317" width="3.5" height="136" rx="1.7" fill="#d29922"/>
    <g class="animated-icon"><text class="card-title" x="774" y="327">⚡ Kafka &amp; Storage Bus</text></g>
    <rect x="1012.6" y="315" width="57.4" height="18" rx="9" fill="#d29922"/>
    <circle cx="1020.6" cy="324" r="3.5" fill="#d29922">
      <animate attributeName="r" values="3.5;8.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020.6" cy="324" r="3.5" fill="#ffffff" opacity="0.9"/>
    <text class="badge-text" x="1045.3" y="327.5" text-anchor="middle">Running</text>
    <text class="card-subtitle" x="774" y="343">Streaming Telemetry Bus</text>
    <text class="card-detail" x="774" y="371">• • kafka-cluster-0</text>
    <text class="card-detail" x="774" y="385">• • zookeeper-cluster-0</text>
    <text class="card-detail" x="774" y="399">• • clickhouse-analytics-db</text>
    <text class="card-detail" x="774" y="413">• • redis-cache-instance</text>
  </g>
  <g id="legend">
    <rect x="950" y="24" width="170" height="80" rx="8" fill="#161b22" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="966" cy="38" r="5" fill="#bc8cff"/>
    <text class="card-detail" x="980" y="42">CAPI Management</text>
    <circle cx="966" cy="58" r="5" fill="#3fb950"/>
    <text class="card-detail" x="980" y="62">Security Microservice</text>
    <circle cx="966" cy="78" r="5" fill="#d29922"/>
    <text class="card-detail" x="980" y="82">Streaming Bus</text>
  </g>
</svg>